name: Build installers and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    name: Linux DEB
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libzip-dev libarchive-dev curl

          # Kirigami ships under different package names across releases
          # (libkf6kirigami-dev on some, libkirigami-dev on Debian/Ubuntu >= 25).
          # Install whatever exists; CMake decides with ABSAND_FRONTEND=auto.
          for package in libkirigami-dev libkf6kirigami-dev; do
            if apt-cache show "$package" >/dev/null 2>&1; then
              sudo apt-get install -y "$package" || true
              break
            fi
          done
          for package in qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
                         qml6-module-org-kde-breeze qt6-declarative-dev; do
            sudo apt-get install -y "$package" || true
          done

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DABSAND_FRONTEND=auto 2>&1 | tee cmake-configure.log
          if grep -q 'Kirigami: ON' cmake-configure.log; then
            echo "ABSAND_FRONTEND=kirigami" >> "$GITHUB_ENV"
          else
            echo "ABSAND_FRONTEND=widgets" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: |
          cmake --build build-linux --parallel 4
          ctest --test-dir build-linux --output-on-failure
          if [[ "${ABSAND_FRONTEND}" == "kirigami" ]]; then
            QT_QPA_PLATFORM=offscreen ./build-linux/Absand --qml-selftest
          fi

      - name: Build DEB package
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cpack --config build-linux/CPackConfig.cmake -G DEB -B release-artifacts
          package=$(find release-artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          output="release-artifacts/Absand-${{ steps.version.outputs.value }}-linux-amd64.deb"
          if [[ "$package" != "$output" ]]; then mv "$package" "$output"; fi
          dpkg-deb --info "$output"
          dpkg-deb --contents "$output"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: absand-linux-deb
          path: release-artifacts/*.deb
          if-no-files-found: error

  linux-deb-kirigami:
    name: Linux DEB (Kirigami)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})." >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the Kirigami package in a Debian 13 container
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          chmod -R a+rwX release-artifacts
          # Debian 13 ships Qt 6.8 and KF6 Kirigami, so this package has the
          # Kirigami/QML UI. The Ubuntu-based package above stays compatible with
          # older distributions and uses the widget front end there.
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/release-artifacts:/out" \
            -w /build \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq \
                build-essential cmake ninja-build pkg-config dpkg-dev file \
                qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-declarative-dev \
                libkirigami-dev qml6-module-org-kde-kirigami \
                qml6-module-org-kde-desktop qml6-module-org-kde-breeze \
                libzip-dev libarchive-dev curl > /dev/null
              cmake -S /src -B /build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DABSAND_FRONTEND=kirigami
              cmake --build /build --parallel "$(nproc)"
              ctest --test-dir /build --output-on-failure
              QT_QPA_PLATFORM=offscreen /build/Absand --qml-selftest
              cpack --config /build/CPackConfig.cmake -G DEB -B /out
            '
          package=$(find release-artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          output="release-artifacts/Absand-${{ steps.version.outputs.value }}-linux-amd64-kirigami.deb"
          if [[ "$package" != "$output" ]]; then mv "$package" "$output"; fi
          dpkg-deb --info "$output"

      - name: Upload Linux Kirigami installer
        uses: actions/upload-artifact@v4
        with:
          name: absand-linux-deb-kirigami
          path: release-artifacts/*.deb
          if-no-files-found: error

  windows-exe:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-ca-certificates

      - name: Choose and install the front end
        shell: msys2 {0}
        run: |
          set -euo pipefail
          frontend=widgets
          if pacman -Si mingw-w64-ucrt-x86_64-kirigami >/dev/null 2>&1; then
            pacman -S --needed --noconfirm \
              mingw-w64-ucrt-x86_64-qt6-declarative mingw-w64-ucrt-x86_64-kirigami
            frontend=kirigami
          fi
          echo "ABSAND_FRONTEND=${frontend}" >> "$GITHUB_ENV"
          echo "Building the ${frontend} front end"
      - name: Read and verify version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Configure, build, test, and stage
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/Absand" \
            -DABSAND_FRONTEND="${ABSAND_FRONTEND}"
          cmake --build build-windows --parallel 4

          # Smoke test the real application first: it must load the QML window
          # and both settings pages.
          if [[ "${ABSAND_FRONTEND}" == "kirigami" ]]; then
            QT_QPA_PLATFORM=offscreen ./build-windows/Absand.exe --qml-selftest
          fi

          # Keep collecting test output; a Windows-only test failure must not
          # hide the diagnostics behind an empty ctest report.
          set +e
          ctest --test-dir build-windows --output-on-failure -V
          test_status=$?
          if [ ${test_status} -ne 0 ]; then
            # Console output is unreliable on this runner, so the failing cases
            # are written to a report file and printed from there.
            echo "--- executable subsystem:"
            objdump -p ./build-windows/AbsandTests.exe | grep -i subsystem || true
            echo "--- unresolved dependencies:"
            ldd ./build-windows/AbsandTests.exe | grep -i "not found" || echo "none"
            QT_QPA_PLATFORM=offscreen ./build-windows/AbsandTests.exe -o "$PWD/test-report.txt,txt" > /dev/null 2>&1
            echo "--- test report:"
            cat "$PWD/test-report.txt" 2>/dev/null || echo "no report written"
          fi
          set -e
          exit ${test_status}
          cmake --install build-windows
          bash packaging/windows/bundle-runtime.sh "$PWD/stage/Absand/bin"

      - name: Build EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $sourceDir = (Resolve-Path "stage/Absand/bin").Path
          $outputDir = (Resolve-Path "release-artifacts").Path
          & $compiler "/DSourceDir=$sourceDir" "/DAppVersion=${{ steps.version.outputs.value }}" "/DOutputDir=$outputDir" "packaging/windows/Absand.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release-artifacts

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: absand-windows-exe
          path: release-artifacts/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [linux-deb, linux-deb-kirigami, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --title "Absand $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi